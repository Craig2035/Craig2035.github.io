# Welcome to Jekyll!

title: "Craig Munday"
email: "craigmunday@hotmail.com"
description: "Data analytics portfolio and projects"
github_username: "Craig2035"
minimal_mistakes_skin: "contrast"
classes: wide
search: true

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes"
theme: null
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone:

sass:
  sass_dir: _sass
  style: compressed

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Craig Munday"
  avatar : "/assets/images/CJMhead.JPG"
  bio: "<span>Data analytics & education professional.</span><span style='display:block; margin-top:6px;'>PhD in Medicine.</span><span style='display:block; margin-top:6px;'>Data Storytelling for operational insights.</span>"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Craig2035"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/craig-munday-773b70367"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Craig2035"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/craig-munday-773b70367"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      pagination: false


category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
